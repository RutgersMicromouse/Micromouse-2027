; PlatformIO Project Configuration File for ESP32-S3 Micromouse
;
;   pio run                       -> builds the robot firmware (env:main) only
;   pio run -e <env> -t upload    -> build + flash one specific environment
;
; What goes on the robot : competition (radios off, hand-wave control only)   -> src/
;                          main (same + Bluetooth / Wi-Fi debug console), ota (main, flashed over Wi-Fi)
; Calibration firmware   : calibration                                      -> src/ + bench/calibration.cpp
; Bench tests            : motor_test, ir_test, imu_test, battery_test,
;                          ble_test, wifi_test                              -> bench/<name>.cpp

[platformio]
default_envs = main


; =============================================================
; SHARED CONFIGURATION
; =============================================================

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = default_8MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_ldf_mode = deep+

lib_deps =
    pololu/Motoron@^1.5.0

build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1


; =============================================================
; ROBOT FIRMWARE (everything in src/)
; =============================================================

; Debug build: hand-wave control plus the Bluetooth / Wi-Fi console for watching what it does
[env:main]

; Competition build: no radios at all. Hand waves are the only control; USB serial still prints.
[env:competition]
build_flags =
    ${env.build_flags}
    -DENABLE_BLE_DEBUG=0
    -DENABLE_WIFI_OTA=0

; Same as main, uploaded over the robot's Wi-Fi hotspot instead of USB
[env:ota]
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --port=3232


; =============================================================
; CALIBRATION FIRMWARE (robot firmware + motor / dyno calibration commands)
; =============================================================

[env:calibration]
build_flags =
    ${env.build_flags}
    -DENABLE_CALIBRATION=1
build_src_filter =
    +<*>
    +<../bench/calibration.cpp>


; =============================================================
; BENCH TESTS (one peripheral each, one file each in bench/)
; =============================================================

[env:motor_test]
build_src_filter =
    -<*>
    +<../bench/motor_test.cpp>

[env:ir_test]
build_src_filter =
    -<*>
    +<../bench/ir_test.cpp>

[env:imu_test]
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit BNO055@^1.6.4
    adafruit/Adafruit Unified Sensor@^1.1.15
build_src_filter =
    -<*>
    +<../bench/imu_test.cpp>

[env:battery_test]
build_src_filter =
    -<*>
    +<../bench/battery_test.cpp>

[env:ble_test]
build_src_filter =
    -<*>
    +<../bench/ble_test.cpp>
    +<wireless.cpp>
    +<hardware.cpp>

[env:wifi_test]
build_src_filter =
    -<*>
    +<../bench/wifi_test.cpp>
    +<wireless.cpp>
