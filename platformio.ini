[platformio]
default_envs = main


; =============================================================
; SHARED CONFIGURATION
; =============================================================

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

lib_ldf_mode = deep+

lib_deps =
    pololu/Motoron@^1.5.0
    adafruit/Adafruit BNO055@^1.6.4
    adafruit/Adafruit Unified Sensor@^1.1.15
    madhephaestus/ESP32Encoder@^0.11.8
    pololu/VL53L1X@^1.3.1


; =============================================================
; MAIN ROBOT
; =============================================================

[env:main]

build_src_filter =
    +<*>
    -<tests/*>


; =============================================================
; BATTERY TEST
; =============================================================

[env:battery_test]

build_src_filter =
    -<*>
    +<tests/battery_test.cpp>
    +<hardware/battery.cpp>


; =============================================================
; BLE TEST
; =============================================================

[env:ble_test]

build_src_filter =
    -<*>
    +<tests/ble_test.cpp>
    +<hardware/ble_debug.cpp>
    +<hardware/battery.cpp>
    +<hardware/imu.cpp>
    +<hardware/encoders.cpp>


; =============================================================
; IMU TEST
; =============================================================

[env:imu_test]

build_src_filter =
    -<*>
    +<tests/imu_test.cpp>


; =============================================================
; IR SENSOR TEST
; =============================================================

[env:ir_test]

build_src_filter =
    -<*>
    +<tests/ir_test.cpp>


; =============================================================
; MOTOR TEST
; =============================================================

[env:motor_test]

build_src_filter =
    -<*>
    +<tests/motor_test.cpp>
    +<hardware/motors.cpp>


; =============================================================
; WIFI TEST
; =============================================================

[env:wifi_test]

build_src_filter =
    -<*>
    +<tests/wifi_test.cpp>