; https://docs.platformio.org/page/projectconf.html

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino

lib_deps =
    pololu/VL53L1X
    adafruit/Adafruit BNO08x @ ^1.2.5
    adafruit/Adafruit BusIO @ ^1.16.1
    pololu/Motoron @ ^1.4.0
    paulstoffregen/Encoder @ ^1.4.4
