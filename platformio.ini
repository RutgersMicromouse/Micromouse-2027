; PlatformIO Project Configuration File for ESP32-S3 Micromouse
;

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = default_8MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps = 
    pololu/Motoron @ ^1.5.0

; Default Unified Firmware (supports all 4 modes dynamically via STATE button)
[env:esp32-s3-devkitc-1]
build_flags = 
    -O2
    -DCORE_DEBUG_LEVEL=1
    -I include

; Target 1: Dedicated Hybrid Auto-Optimizer (Curve vs Diagonal Benchmarking)
[env:esp32s3_hybrid]
build_flags = 
    -O2
    -DCORE_DEBUG_LEVEL=1
    -I include
    -DFORCE_HYBRID_AUTO

; Target 2: Dedicated Pure Diagonal Specialist (Locks directly to 45° Diagonal Sprints)
[env:esp32s3_diagonals_only]
build_flags = 
    -O2
    -DCORE_DEBUG_LEVEL=1
    -I include
    -DFORCE_PURE_DIAGONALS

; Target 3: Dedicated Pure Continuous Curves (Smooth 90° Tangent Arcs)
[env:esp32s3_curves_only]
build_flags = 
    -O2
    -DCORE_DEBUG_LEVEL=1
    -I include
    -DFORCE_PURE_CURVES

; Target 4: Wireless Over-The-Air Flashing (Uploads directly over Wi-Fi without USB cable)
[env:esp32s3_ota]
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags = 
    --port=3232
build_flags = 
    -O2
    -DCORE_DEBUG_LEVEL=1
    -I include
