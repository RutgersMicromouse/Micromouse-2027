; PlatformIO Project Configuration File for ESP32-S3 Micromouse


; ============================================================
; SHARED CONFIGURATION
; ============================================================

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.partitions = default_8MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_ldf_mode = deep+

lib_deps =
    pololu/Motoron @ ^1.5.0
    adafruit/Adafruit BNO055


; ============================================================
; NORMAL ROBOT FIRMWARE
; ============================================================

; Default Unified Firmware
; Supports all 4 modes dynamically via STATE button

[env:esp32-s3-devkitc-1]

build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
    -I include

; Do NOT compile standalone test programs
build_src_filter =
    +<*>
    -<tests/>


; ============================================================
; TARGET 1
; Dedicated Hybrid Auto-Optimizer
; ============================================================

[env:esp32s3_hybrid]

build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
    -I include
    -DFORCE_HYBRID_AUTO

build_src_filter =
    +<*>
    -<tests/>


; ============================================================
; TARGET 2
; Dedicated Pure Diagonal Specialist
; ============================================================

[env:esp32s3_diagonals_only]

build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
    -I include
    -DFORCE_PURE_DIAGONALS

build_src_filter =
    +<*>
    -<tests/>


; ============================================================
; TARGET 3
; Dedicated Pure Continuous Curves
; ============================================================

[env:esp32s3_curves_only]

build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
    -I include
    -DFORCE_PURE_CURVES

build_src_filter =
    +<*>
    -<tests/>


; ============================================================
; TARGET 4
; Wireless Over-The-Air Flashing
; ============================================================

[env:esp32s3_ota]

upload_protocol = espota
upload_port = 192.168.4.1

upload_flags =
    --port=3232

build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
    -I include

build_src_filter =
    +<*>
    -<tests/>


; ============================================================
; TARGET 5
; Optical Dyno Calibration Firmware
; ============================================================

[env:esp32s3_dyno_calib]

build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
    -I include
    -DENABLE_DYNO_CALIBRATION=1

build_src_filter =
    +<*>
    -<tests/>


; ============================================================
;                    HARDWARE TESTS
; ============================================================


; ============================================================
; BATTERY TEST
; ============================================================

[env:battery_test]

build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1
    -I include

build_src_filter =
    -<*>
    +<hardware/battery.cpp>
    +<tests/battery_test.cpp>


