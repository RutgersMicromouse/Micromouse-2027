<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <title>Antigrav Mouse Telemetry</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">MICROMOUSE TELEMETRY</p>
        <h1>Antigrav-Mouse</h1>
      </div>
      <div id="status" class="status offline"><span></span>Disconnected</div>
    </header>

    <section class="controls">
      <button id="connectBtn">Connect to Mouse</button>
      <button id="refreshBtn" class="secondary" disabled>Refresh</button>
    </section>

    <section class="grid">
      <article class="card">
        <p>Battery</p>
        <div><strong id="battery">--</strong><span>V</span></div>
      </article>
      <article class="card">
        <p>Heading</p>
        <div><strong id="heading">--</strong><span>°</span></div>
      </article>
      <article class="card">
        <p>Left Encoder</p>
        <div><strong id="left">--</strong><span>ticks</span></div>
      </article>
      <article class="card">
        <p>Right Encoder</p>
        <div><strong id="right">--</strong><span>ticks</span></div>
      </article>
    </section>

    <section class="actions">
      <button id="resetHeading" class="secondary" disabled>Reset Heading</button>
      <button id="resetEncoders" class="secondary" disabled>Reset Encoders</button>
    </section>

    <p id="message" class="message">
      Open this page in a browser with Web Bluetooth support, then connect to Antigrav-Mouse.
    </p>
  </main>
  <script src="app.js"></script>
</body>
</html>
