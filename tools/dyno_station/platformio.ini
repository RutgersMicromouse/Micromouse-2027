; PlatformIO Project Configuration for Autonomous Dyno Station ESP32
; Connects wirelessly via BLE to the Micromouse bot, monitors dual optical slit wheels,
; and auto-tunes stiction, Kv trim, velocity PID, and differential speed synchronization.

[env:dyno_esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = 
    -O2
    -DCORE_DEBUG_LEVEL=1

[env:dyno_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = 
    -O2
    -DCORE_DEBUG_LEVEL=1
